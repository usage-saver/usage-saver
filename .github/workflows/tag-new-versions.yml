# Adds a version tag (like v0.2.1) whenever a new version of the plugin reaches main.
# The version comes from .claude-plugin/plugin.json. It uses no outside actions and installs nothing.
name: Tag new versions

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: tag-new-versions
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # only to add the tag
    steps:
      - name: Tag this version if it isn't tagged yet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Read the version from plugin.json as it is in this push
          version=$(gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/.claude-plugin/plugin.json?ref=$SHA" --jq '.version // ""' || true)
          if ! printf '%s' "$version" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Couldn't find a plain X.Y.Z version in plugin.json, so no tag was added."
            exit 1
          fi
          tag="v$version"
          if gh api "repos/$REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "$tag already exists, so there's nothing to do."
            exit 0
          fi
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" --silent
          echo "Added $tag at $SHA."
